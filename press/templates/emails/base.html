<table class="sm:bg-white bg-gray-100" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
        <td align="center" valign="top">
            <table cellpadding="0" cellspacing="0" role="presentation" width="600px">
                <tbody>
                    <tr>
                        <td class="px-8 py-10 text-center text-gray-900">
                            <!-- mondaysys-logo --><div style="margin-bottom:12px"><img src="https://cloud.mondaypos.com/files/brand/mondaysys-logo-email.png" alt="Mondaysys Cloud" height="40" style="height:40px;width:auto;border:0"></div>
                            <div>
                                <span class="font-bold text-xl">
                                {% if title %}
                                    {{ title }}
                                {% else %}
                                    Mondaysys Cloud
                                {% endif %}
                                </span>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        {% block content %}{% endblock %}
                    </tr>
                    <tr>
                        <td class="py-8">
                            &nbsp;
                        </td>
                    </tr>
                </tbody>
            </table>
        </td>
    </tr>
</table>
